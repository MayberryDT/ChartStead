<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartStead — Full shell · 10 directions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #081D3A;
      --on-primary: #FFFFFF;
      --primary-hover: #102C56;
      --primary-active: #06152B;
      --secondary: #2F5D98;
      --on-secondary: #FFFFFF;
      --secondary-hover: #254C7E;
      --secondary-active: #1D3D67;
      --tertiary: #22B573;
      --on-tertiary: #081D3A;
      --bg: #FFFFFF;
      --on: #081D3A;
      --subtle: #F3F5F7;
      --muted-bg: #E9EDF2;
      --variant: #526071;
      --muted: #5B6878;
      --outline: #D7DEE7;
      --outline-strong: #AEBAC8;
      --selection: #EAF2FB;
      --nav-active: #173B70;
      --info: #EAF2FB; --on-info: #244E7D;
      --ok: #E9F8F1; --on-ok: #087A4D;
      --warn: #FFF4E5; --on-warn: #8A4D09;
      --err: #FDECEA; --on-err: #8A1C13;
      --tb: #E8F1FB; --on-tb: #245486;
      --tg: #E8F7F0; --on-tg: #087A4D;
      --tp: #F0EBFA; --on-tp: #5C3F8C;
      --ta: #FFF4E5; --on-ta: #8A4D09;
      --focus: #2F5D98;
      --scrim: rgba(8,29,58,.45);
      --sh1: 0 1px 2px rgba(8,29,58,.06);
      --sh2: 0 4px 14px rgba(8,29,58,.08);
      --sh3: 0 16px 40px rgba(8,29,58,.16);
      --r: 2px;
      --ease: cubic-bezier(.2,.8,.2,1);
      --out: cubic-bezier(.16,1,.3,1);
      --d: 150ms;
      --d2: 260ms;
      --mark-d: url("../assets/brand/chartstead-mark-on-dark.png");
      --mark-l: url("../assets/brand/chartstead-mark-on-light.png");
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      font-size: 14px; line-height: 1.45;
      color: var(--on); background: #E2E7EE;
      font-feature-settings: "tnum" 1;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

    /* proto chrome */
    .px {
      position: sticky; top: 0; z-index: 1000;
      background: var(--primary); color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .px-i {
      max-width: 1540px; margin: 0 auto;
      padding: 8px 12px; min-height: 46px;
      display: flex; align-items: center; gap: 10px;
    }
    .px h1 {
      margin: 0; font-size: 11px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      opacity: .75; white-space: nowrap;
    }
    .px nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; scrollbar-width: none; }
    .px nav::-webkit-scrollbar { display: none; }
    .px a {
      flex-shrink: 0; font-size: 11px; font-weight: 600;
      padding: 6px 8px; color: rgba(255,255,255,.7);
      transition: background var(--d) var(--ease), color var(--d) var(--ease);
    }
    .px a:hover { color: #fff; background: rgba(255,255,255,.08); }
    .px a b { opacity: .4; font-weight: 600; margin-right: 4px; }

    .stage {
      max-width: 1540px; margin: 0 auto;
      padding: 12px 12px 64px;
      display: flex; flex-direction: column; gap: 28px;
    }
    .opt { scroll-margin-top: 52px; }
    .opt-m { margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
    .opt-m h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.015em; }
    .opt-m h2 em { font-style: normal; color: var(--muted); margin-right: 8px; font-weight: 500; }
    .opt-m p { margin: 0; font-size: 12px; color: var(--variant); max-width: 78ch; }

    .frame {
      height: calc(100vh - 80px);
      min-height: 640px; max-height: 900px;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--outline-strong);
      box-shadow: var(--sh2);
    }
    .app { height: 100%; min-height: 0; display: grid; background: var(--bg); }

    /* —— shared atoms —— */
    .btn {
      --bgc: var(--bg); --fg: var(--secondary); --bd: var(--outline-strong);
      --bgh: var(--selection); --bdh: var(--secondary);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 12px;
      font-size: 13px; font-weight: 600;
      color: var(--fg); background: var(--bgc); border: 1px solid var(--bd);
      border-radius: var(--r);
      box-shadow: 0 1px 0 rgba(8,29,58,.04);
      transition: background var(--d) var(--ease), border-color var(--d) var(--ease), color var(--d) var(--ease), transform 90ms var(--ease), box-shadow var(--d) var(--ease);
      user-select: none; white-space: nowrap;
    }
    .btn:hover { background: var(--bgh); border-color: var(--bdh); }
    .btn:active { transform: translateY(1px); box-shadow: none; }
    .btn-p { --bgc: var(--secondary); --fg: #fff; --bd: var(--secondary); --bgh: var(--secondary-hover); --bdh: var(--secondary-hover); }
    .btn-ok { --bgc: var(--ok); --fg: var(--on-ok); --bd: #B7E5CF; --bgh: #D4F3E4; --bdh: var(--on-ok); }
    .btn-mb { --bgc: var(--warn); --fg: var(--on-warn); --bd: #F0D4A8; --bgh: #FFE8C2; --bdh: var(--on-warn); }
    .btn-no { --bgc: var(--bg); --fg: var(--on-err); --bd: #E8B4AF; --bgh: var(--err); --bdh: var(--on-err); }
    .btn-g { --bgc: transparent; --fg: var(--secondary); --bd: transparent; --bgh: var(--selection); --bdh: transparent; box-shadow: none; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; }
    .btn-xs { height: 26px; padding: 0 8px; font-size: 11.5px; }
    .btn.flash { animation: flash var(--d2) var(--out); }
    @keyframes flash { from { box-shadow: 0 0 0 0 rgba(47,93,152,.35);} to { box-shadow: 0 0 0 7px transparent;} }

    .flag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
      color: var(--variant);
    }
    .flag::before { content: ""; width: 3px; height: 12px; background: var(--outline-strong); }
    .flag-u { color: var(--on-info); } .flag-u::before { background: var(--secondary); }
    .flag-a { color: var(--on-ok); } .flag-a::before { background: var(--tertiary); }
    .flag-m { color: var(--on-warn); } .flag-m::before { background: #C47A16; }
    .flag-d { color: var(--on-err); } .flag-d::before { background: #B42318; }
    .flag-box {
      height: 22px; padding: 0 8px;
      border: 1px solid currentColor; background: var(--subtle);
    }
    .flag-box::before { display: none; }
    .flag-box.flag-u { background: var(--info); border-color: #B7CCE8; }
    .flag-box.flag-a { background: var(--ok); border-color: #B7E5CF; }
    .flag-box.flag-m { background: var(--warn); border-color: #F0D4A8; }
    .flag-box.flag-d { background: var(--err); border-color: #E8B4AF; }

    .trk {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 8px; font-size: 11.5px; font-weight: 600;
      border-radius: var(--r);
    }
    .trk::before { content: ""; width: 6px; height: 6px; background: currentColor; }
    .trk-p { background: var(--tb); color: var(--on-tb); }
    .trk-o { background: var(--tg); color: var(--on-tg); }
    .trk-d { background: var(--tp); color: var(--on-tp); }
    .trk-c { background: var(--ta); color: var(--on-ta); }

    .av {
      width: 28px; height: 28px; display: inline-grid; place-items: center;
      font-size: 10px; font-weight: 700;
      background: var(--muted-bg); color: var(--variant);
      border: 1px solid var(--outline); border-radius: var(--r); flex-shrink: 0;
    }

    .field {
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 10px;
      background: var(--bg); border: 1px solid var(--outline); border-radius: var(--r);
      transition: border-color var(--d) var(--ease), box-shadow var(--d) var(--ease);
    }
    .field:hover { border-color: var(--outline-strong); }
    .field:focus-within { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(47,93,152,.14); }
    .field svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 1.75; flex-shrink: 0; }
    .field:focus-within svg { stroke: var(--secondary); }
    .field input { flex: 1; min-width: 0; border: 0; background: transparent; height: 100%; font-size: 13px; }
    .field input::placeholder { color: var(--muted); }

    .seg { display: inline-flex; border: 1px solid var(--outline-strong); background: var(--bg); }
    .seg button {
      height: 30px; padding: 0 11px; font-size: 12px; font-weight: 600;
      color: var(--variant); border-right: 1px solid var(--outline);
      transition: background var(--d) var(--ease), color var(--d) var(--ease);
    }
    .seg button:last-child { border-right: 0; }
    .seg button:hover { background: var(--subtle); color: var(--on); }
    .seg button[aria-pressed="true"] { background: var(--primary); color: #fff; }
    .seg button .n { margin-left: 5px; opacity: .65; font-weight: 500; }

    .ico {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
    }
    .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: .02em; }

    /* table */
    .tw { overflow: auto; flex: 1; min-height: 0; }
    table.g { width: 100%; border-collapse: collapse; }
    table.g th {
      text-align: left; height: 34px; padding: 0 12px;
      background: var(--subtle); color: var(--variant);
      font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
      border-bottom: 1px solid var(--outline); position: sticky; top: 0; z-index: 1; white-space: nowrap;
    }
    table.g td {
      height: 50px; padding: 8px 12px; border-bottom: 1px solid var(--outline);
      vertical-align: middle; transition: background var(--d) var(--ease);
    }
    table.g tbody tr { cursor: pointer; }
    table.g tbody tr:hover td { background: rgba(234,242,251,.55); }
    table.g tbody tr.sel td { background: var(--selection); }
    table.g tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--secondary); }
    .talk { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
    .sub { font-size: 12px; color: var(--variant); margin-top: 2px; }
    .mu { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }

    /* inspector */
    .insp {
      border-left: 1px solid var(--outline);
      background: var(--bg);
      display: flex; flex-direction: column;
      min-height: 0; overflow: auto;
    }
    .insp-h {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--outline);
      display: flex; flex-direction: column; gap: 8px;
    }
    .insp-h .k { font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .insp-h h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
    .insp-h .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--variant); }
    .insp-b { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .panel {
      border: 1px solid var(--outline); padding: 11px 12px; background: var(--subtle);
      transition: border-color var(--d) var(--ease);
    }
    .panel:hover { border-color: var(--outline-strong); }
    .panel h4 { margin: 0 0 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .panel p { margin: 0; font-size: 13px; line-height: 1.5; }
    .panel textarea {
      width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--outline);
      background: #fff; padding: 8px; font-size: 13px; border-radius: var(--r);
    }
    .panel textarea:focus { border-color: var(--secondary); box-shadow: 0 0 0 3px rgba(47,93,152,.12); outline: 0; }
    .insp-f {
      margin-top: auto; padding: 12px 16px;
      border-top: 1px solid var(--outline);
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
      background: var(--bg);
    }

    .work { min-height: 0; display: flex; flex-direction: column; background: var(--bg); position: relative; }
    .tools {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 16px; border-bottom: 1px solid var(--outline); background: var(--bg);
    }
    .split { display: grid; min-height: 0; flex: 1; }
    .split-md { grid-template-columns: 1fr minmax(280px, 320px); }
    .split-md-wide { grid-template-columns: 1fr minmax(300px, 360px); }
    .split-md-slim { grid-template-columns: 1fr minmax(260px, 300px); }

    .ct {
      margin-left: auto; font-size: 11px; font-weight: 600;
      min-width: 20px; height: 18px; padding: 0 5px;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.08);
    }

    /* toast */
    .toast {
      position: fixed; bottom: 18px; right: 18px; z-index: 2000;
      background: var(--primary); color: #fff; padding: 11px 14px;
      font-size: 13px; font-weight: 600; border-left: 3px solid var(--tertiary);
      box-shadow: var(--sh3); transform: translateY(10px); opacity: 0;
      transition: transform var(--d2) var(--out), opacity var(--d2) var(--ease);
      pointer-events: none; max-width: 300px;
    }
    .toast.show { transform: none; opacity: 1; }

    /* ========== SHELL VARIANTS ========== */

    /* A: Classic deep indigo sidebar */
    .shell-a { grid-template-columns: 248px 1fr; }
    .shell-a .sb {
      background: var(--primary); color: #fff;
      display: flex; flex-direction: column; padding: 14px 10px; min-height: 0;
    }
    .shell-a .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
    .shell-a .brand img { width: 32px; height: 32px; }
    .shell-a .brand .nm { font-size: 15px; font-weight: 600; letter-spacing: -.02em; }
    .shell-a .brand .ds { font-size: 11px; opacity: .55; }
    .shell-a .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .shell-a .nav a {
      display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px;
      font-size: 13.5px; font-weight: 600; color: rgba(255,255,255,.72);
      border-left: 2px solid transparent;
      transition: background var(--d) var(--ease), color var(--d) var(--ease), border-color var(--d) var(--ease);
    }
    .shell-a .nav a:hover { background: var(--primary-hover); color: #fff; }
    .shell-a .nav a.on { background: var(--nav-active); color: #fff; border-left-color: var(--tertiary); }
    .shell-a .foot {
      margin-top: auto; padding: 12px; text-align: left;
      border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04);
      transition: background var(--d) var(--ease);
    }
    .shell-a .foot:hover { background: rgba(255,255,255,.08); }
    .shell-a .foot .l { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .5; }
    .shell-a .foot .e { font-size: 13px; font-weight: 600; margin-top: 4px; line-height: 1.3; }
    .shell-a .main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; min-height: 0; }
    .shell-a .top {
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      border-bottom: 1px solid var(--outline); background: #fff;
    }
    .shell-a .top h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
    .shell-a .top .meta { font-size: 12.5px; color: var(--variant); }
    .shell-a .top .sp { flex: 1; }

    /* B: Icon rail + content topbar with brand */
    .shell-b { grid-template-columns: 72px 1fr; }
    .shell-b .sb {
      background: var(--primary); color: #fff;
      display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px;
    }
    .shell-b .brand { padding: 4px 0 14px; }
    .shell-b .brand img { width: 36px; height: 36px; transition: transform var(--d2) var(--out); }
    .shell-b .brand:hover img { transform: rotate(-10deg); }
    .shell-b .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; width: 100%; align-items: center; }
    .shell-b .nav a {
      width: 44px; height: 44px; display: grid; place-items: center;
      color: rgba(255,255,255,.65);
      border-bottom: 2px solid transparent;
      transition: background var(--d) var(--ease), color var(--d) var(--ease), border-color var(--d) var(--ease);
    }
    .shell-b .nav a:hover { background: var(--primary-hover); color: #fff; }
    .shell-b .nav a.on { background: var(--nav-active); color: #fff; border-bottom-color: var(--tertiary); }
    .shell-b .nav a .lbl, .shell-b .nav a .ct { display: none; }
    .shell-b .foot { display: none; }
    .shell-b .main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; min-height: 0; }
    .shell-b .top {
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      border-bottom: 1px solid var(--outline); background: #fff;
    }
    .shell-b .top .word { font-size: 14px; font-weight: 600; letter-spacing: -.01em; padding-right: 14px; border-right: 1px solid var(--outline); }
    .shell-b .top h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .shell-b .top .meta { font-size: 12.5px; color: var(--variant); }
    .shell-b .top .sp { flex: 1; }

    /* C: Light structural sidebar */
    .shell-c { grid-template-columns: 240px 1fr; background: var(--subtle); }
    .shell-c .sb {
      background: #fff; color: var(--on);
      border-right: 1px solid var(--outline);
      display: flex; flex-direction: column; padding: 14px 12px; min-height: 0;
    }
    .shell-c .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; }
    .shell-c .brand img { width: 30px; height: 30px; }
    .shell-c .brand .nm { font-size: 15px; font-weight: 600; }
    .shell-c .brand .ds { font-size: 11px; color: var(--muted); }
    .shell-c .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .shell-c .nav a {
      display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px;
      font-size: 13.5px; font-weight: 600; color: var(--variant);
      border-left: 2px solid transparent;
      transition: background var(--d) var(--ease), color var(--d) var(--ease), border-color var(--d) var(--ease);
    }
    .shell-c .nav a:hover { background: var(--subtle); color: var(--on); }
    .shell-c .nav a.on { background: var(--selection); color: var(--nav-active); border-left-color: var(--secondary); }
    .shell-c .nav a .ct { border-color: var(--outline); background: var(--subtle); color: var(--variant); }
    .shell-c .nav a.on .ct { background: #fff; border-color: #B7CCE8; color: var(--secondary); }
    .shell-c .foot {
      margin-top: auto; padding: 12px; text-align: left;
      border: 1px solid var(--outline); background: var(--subtle);
    }
    .shell-c .foot .l { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .shell-c .foot .e { font-size: 13px; font-weight: 600; margin-top: 4px; }
    .shell-c .main { display: grid; grid-template-rows: 56px 1fr; min-width: 0; min-height: 0; background: #fff; }
    .shell-c .top {
      display: flex; align-items: center; gap: 14px; padding: 0 18px;
      border-bottom: 1px solid var(--outline);
    }
    .shell-c .top h1 { margin: 0; font-size: 18px; font-weight: 600; }
    .shell-c .top .meta { font-size: 12.5px; color: var(--variant); }
    .shell-c .top .sp { flex: 1; }

    /* D: Dual keel — icon rail + label column */
    .shell-d { grid-template-columns: 72px 188px 1fr; }
    .shell-d .sb-ico {
      background: var(--primary); color: #fff;
      display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px;
    }
    .shell-d .sb-ico .brand img { width: 34px; height: 34px; margin-bottom: 12px; }
    .shell-d .sb-ico a {
      width: 44px; height: 44px; display: grid; place-items: center; color: rgba(255,255,255,.65);
      transition: background var(--d) var(--ease), color var(--d) var(--ease);
    }
    .shell-d .sb-ico a:hover, .shell-d .sb-ico a.on { background: var(--nav-active); color: #fff; }
    .shell-d .sb-lab {
      background: var(--subtle); border-right: 1px solid var(--outline);
      display: flex; flex-direction: column; padding: 14px 10px; min-height: 0;
    }
    .shell-d .sb-lab .sec { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 6px; }
    .shell-d .sb-lab a {

    const stage = document.getElementById("stage");
    stage.innerHTML = DIRS.map((d,i) => `
      <section class="opt" id="${d.id}">
        <div class="opt-m">
          <h2><em>${String(i+1).padStart(2,"0")}</em>${d.name}</h2>
          <p>${d.blurb}</p>
        </div>
        <div class="frame" data-frame>${d.html()}</div>
      </section>`).join("");

    const toastEl = document.getElementById("toast");
    let tt;
    const toast = (m) => {
      toastEl.textContent = m;
      toastEl.classList.add("show");
      clearTimeout(tt);
      tt = setTimeout(() => toastEl.classList.remove("show"), 1600);
    };

    const find = id => SUBS.find(s => s.id === id) || SUBS[0];

    const fill = (root, s) => {
      root.querySelectorAll("[data-t]").forEach(el => el.textContent = s.title);
      root.querySelectorAll("[data-abs]").forEach(el => el.textContent = s.abs);
      root.querySelectorAll("[data-note]").forEach(el => el.textContent = s.note);
      root.querySelectorAll("[data-who]").forEach(el => el.textContent = `${s.speaker} · ${s.track} · ${s.fmt}`);
      root.querySelectorAll("[data-av]").forEach(el => el.textContent = s.av);
      root.querySelectorAll("[data-fl]").forEach(el => { el.innerHTML = flag(s.st, s.sl, true); });
      const k = root.querySelector(".insp-h .k");
      if (k) k.textContent = `SUB-${s.id}`;
    };

    document.querySelectorAll("[data-frame]").forEach(frame => {
      frame.querySelectorAll("[data-nav]").forEach(a => {
        a.addEventListener("click", e => {
          e.preventDefault();
          const nav = a.closest("nav, .sb, .sb-lab, .sb-ico, .mast");
          if (!nav) return;
          // scope activation to sibling group
          const scope = a.parentElement;
          scope.querySelectorAll("[data-nav]").forEach(x => x.classList.remove("on"));
          a.classList.add("on");
          // dual keel sync icons roughly
          toast(`Nav · ${a.getAttribute("title") || a.textContent.replace(/\d+/g,"").trim().slice(0,28)}`);
        });
      });

      frame.querySelectorAll("[data-q]").forEach(input => {
        input.addEventListener("input", () => {
          const q = input.value.trim().toLowerCase();
          frame.querySelectorAll("tbody tr[data-id]").forEach(tr => {
            const s = find(tr.dataset.id);
            const hay = `${s.title} ${s.speaker} ${s.id} ${s.track}`.toLowerCase();
            tr.style.display = !q || hay.includes(q) ? "" : "none";
          });
        });
      });

      frame.querySelectorAll("[data-q-global]").forEach(input => {
        input.addEventListener("keydown", e => {
          if (e.key === "Enter") toast(`Search ChartStead · “${input.value || "…"}”`);
        });
      });

      frame.querySelectorAll("[data-seg]").forEach(seg => {
        seg.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => {
            seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
            btn.setAttribute("aria-pressed","true");
            toast(`Filter · ${btn.textContent.replace(/\s+/g," ").trim()}`);
          });
        });
      });

      frame.querySelectorAll("[data-ptabs]").forEach(tabs => {
        tabs.querySelectorAll("button").forEach(btn => {
          btn.addEventListener("click", () => {
            tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected","false"));
            btn.setAttribute("aria-selected","true");
            toast(`Tab · ${btn.textContent}`);
          });
        });
      });

      frame.querySelectorAll("tbody tr[data-id]").forEach(tr => {
        tr.addEventListener("click", () => {
          frame.querySelectorAll("tbody tr").forEach(r => r.classList.remove("sel"));
          tr.classList.add("sel");
          fill(frame, find(tr.dataset.id));
        });
        tr.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tr.click(); }
        });
      });

      frame.querySelectorAll("[data-dec]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          btn.classList.remove("flash"); void btn.offsetWidth; btn.classList.add("flash");
          const map = { approve:"Approved", maybe:"Marked maybe", deny:"Denied" };
          toast(`${map[btn.dataset.dec]} · PODS 2026`);
        });
      });

      frame.querySelectorAll("[data-act]").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          const map = {
            export:"Export started", cfp:"Opening CFP form…", event:"Event switcher",
            home:"Home", help:"Help center", account:"Account menu", track:"Track filter",
          };
          toast(map[btn.dataset.act] || "Done");
        });
      });
    });
