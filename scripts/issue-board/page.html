<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>ChartStead · Issues</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Dark ChartStead shell — primary navy, not pure black */
      --primary: #081d3a;
      --on-primary: #e8eef6;
      --secondary: #5b8fd4;
      --tertiary: #2ecc87;
      --bg: #0c1424;
      --surface: #121c2e;
      --surface-raised: #172338;
      --surface-subtle: #1a2740;
      --surface-muted: #22314d;
      --on-surface: #e6edf7;
      --on-surface-variant: #a8b6cb;
      --on-surface-muted: #7f90a8;
      --outline: #2a3a55;
      --outline-strong: #3d516f;
      --selection: #1c3358;
      --info-container: #17324f;
      --on-info-container: #9ec0ef;
      --success-container: #123528;
      --on-success-container: #8fe0b5;
      --warning-container: #3a2c12;
      --on-warning-container: #f0c674;
      --error-container: #3a1816;
      --on-error-container: #f0b4ae;
      --focus-ring: #5b8fd4;
      --r: 2px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --dur: 140ms;
      --topbar: 52px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: var(--on-surface);
      background: var(--bg);
      font-feature-settings: "tnum" 1;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
      text-align: left;
    }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: var(--topbar) 1fr auto;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: stretch;
      gap: 16px;
      padding: 0 14px;
      height: var(--topbar);
      background: var(--primary);
      color: var(--on-primary);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand img {
      width: 22px;
      height: 22px;
      display: block;
      flex: 0 0 auto;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 0;
      min-width: 0;
      line-height: 1.15;
    }
    .brand strong {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand span {
      font-size: 10px;
      color: rgba(232, 238, 246, 0.5);
      letter-spacing: 0.02em;
    }

    .tabs {
      display: flex;
      align-items: stretch;
      justify-content: flex-start;
      gap: 2px;
      min-width: 0;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(232, 238, 246, 0.55);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab:hover {
      color: rgba(232, 238, 246, 0.9);
      background: rgba(255, 255, 255, 0.04);
    }
    .tab[aria-selected="true"] {
      color: #fff;
      border-bottom-color: var(--tertiary);
      background: rgba(255, 255, 255, 0.05);
    }
    .tab b {
      min-width: 1.4em;
      padding: 1px 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.2);
      color: rgba(232, 238, 246, 0.7);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      border-radius: var(--r);
    }
    .tab[aria-selected="true"] b {
      border-color: rgba(46, 204, 135, 0.35);
      background: rgba(46, 204, 135, 0.12);
      color: #9ae6c3;
    }

    .top-meta {
      display: flex;
      align-items: stretch;
      align-self: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.18);
    }
    .stat {
      display: grid;
      justify-items: center;
      min-width: 48px;
      padding: 3px 9px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .stat:last-child { border-right: 0; }
    .stat b {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      color: #fff;
    }
    .stat em {
      font-style: normal;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(232, 238, 246, 0.45);
    }
    .live {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      font-size: 11px;
      color: rgba(232, 238, 246, 0.55);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }
    .live i {
      width: 6px;
      height: 6px;
      background: var(--tertiary);
      display: inline-block;
    }

    .board-wrap {
      padding: 12px;
      min-height: 0;
      overflow: auto;
    }

    .board {
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-items: start;
      width: 100%;
      min-height: calc(100vh - var(--topbar) - 44px);
    }
    .board.is-active { display: grid; }

    .col {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--outline);
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }
    .col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--outline);
      background: var(--surface-raised);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-muted);
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .col-head b {
      font-weight: 600;
      color: var(--on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .list {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .empty {
      padding: 14px 12px;
      color: var(--on-surface-muted);
      font-size: 12px;
    }

    .card {
      border-bottom: 1px solid var(--outline);
      background: var(--surface);
    }
    .card:last-child { border-bottom: 0; }
    .card[data-col="done"] { box-shadow: inset 3px 0 0 var(--tertiary); }
    .card[data-col="open"] { box-shadow: inset 3px 0 0 var(--secondary); }
    .card[data-col="in-progress"] { box-shadow: inset 3px 0 0 #9b7fd4; }
    .card[data-col="blocked"] { box-shadow: inset 3px 0 0 #d4a24a; }

    .summary {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 14px;
      gap: 3px 10px;
      padding: 10px 12px;
      align-items: start;
    }
    .summary:hover { background: var(--selection); }
    .card.is-open > .summary {
      background: var(--selection);
      border-bottom: 1px solid var(--outline);
    }
    .id {
      grid-column: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--on-surface-muted);
      line-height: 1.2;
    }
    .chev {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      width: 14px;
      height: 14px;
      color: var(--on-surface-muted);
      transition: transform var(--dur) var(--ease);
    }
    .card.is-open .chev { transform: rotate(90deg); }
    .title {
      grid-column: 1;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--on-surface);
    }
    .meta-line {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
      margin-top: 2px;
      font-size: 11px;
      color: var(--on-surface-muted);
    }
    .flag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 6px;
      border: 1px solid var(--outline);
      background: var(--surface-subtle);
      color: var(--on-surface-variant);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.3;
      text-transform: lowercase;
      border-radius: var(--r);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .flag::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--outline-strong);
    }
    .flag.done {
      background: var(--success-container);
      color: var(--on-success-container);
      border-color: #1f5a40;
    }
    .flag.done::before { background: var(--tertiary); }
    .flag.open {
      background: var(--info-container);
      color: var(--on-info-container);
      border-color: #2a4a72;
    }
    .flag.open::before { background: var(--secondary); }
    .flag.in-progress {
      background: #2a2140;
      color: #d4c2ff;
      border-color: #46386a;
    }
    .flag.in-progress::before { background: #9b7fd4; }
    .flag.blocked {
      background: var(--warning-container);
      color: var(--on-warning-container);
      border-color: #5c4520;
    }
    .flag.blocked::before { background: #d4a24a; }

    .detail {
      display: none;
      padding: 12px 14px 14px;
      background: var(--surface-raised);
      gap: 12px;
    }
    .card.is-open .detail { display: grid; }
    .detail p {
      margin: 0;
      font-size: 13px;
      color: var(--on-surface-variant);
      line-height: 1.5;
    }
    .detail h3 {
      margin: 0 0 6px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-muted);
    }
    .checks, .notes {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 5px;
    }
    .checks li {
      display: grid;
      grid-template-columns: 14px 1fr;
      gap: 8px;
      font-size: 12.5px;
      color: var(--on-surface-variant);
      line-height: 1.4;
    }
    .checks li i {
      width: 12px;
      height: 12px;
      margin-top: 2px;
      border: 1px solid var(--outline-strong);
      background: var(--surface);
      border-radius: var(--r);
    }
    .checks li.on i {
      background: var(--tertiary);
      border-color: var(--tertiary);
    }
    .checks li.on {
      color: var(--on-surface-muted);
      text-decoration: line-through;
      text-decoration-color: var(--outline-strong);
    }
    .kv {
      display: grid;
      gap: 5px;
      font-size: 12px;
      color: var(--on-surface-muted);
    }
    .kv code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--on-surface-variant);
      word-break: break-all;
    }
    .notes li {
      font-size: 12.5px;
      color: var(--on-surface-variant);
      padding: 8px 10px;
      border: 1px solid var(--outline);
      background: var(--surface);
      border-radius: var(--r);
      line-height: 1.45;
    }

    .foot {
      padding: 8px 16px 12px;
      font-size: 11px;
      color: var(--on-surface-muted);
      border-top: 1px solid var(--outline);
      background: var(--surface);
    }
    .foot code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10.5px;
      color: var(--on-surface-variant);
    }
    .error {
      margin: 16px;
      padding: 16px;
      border: 1px solid #5c2a26;
      background: var(--error-container);
      color: var(--on-error-container);
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        height: auto;
        padding: 8px 12px;
        gap: 8px;
      }
      .brand { grid-column: 1; }
      .top-meta { grid-column: 2; grid-row: 1; }
      .tabs {
        grid-column: 1 / -1;
        grid-row: 2;
      }
      .board.is-active { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .board.is-active { grid-template-columns: 1fr; }
      .top-meta .stat:nth-child(n+3):not(.live) { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="/favicon.svg" width="22" height="22" alt="" />
        <div class="brand-text">
          <strong>ChartStead</strong>
          <span>Issue board</span>
        </div>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Issue tracks"></nav>
      <div class="top-meta" aria-label="Summary counts">
        <div class="stat"><b id="c-total">0</b><em>total</em></div>
        <div class="stat"><b id="c-done">0</b><em>done</em></div>
        <div class="stat"><b id="c-open">0</b><em>open</em></div>
        <div class="stat"><b id="c-other">0</b><em>other</em></div>
        <div class="live"><i aria-hidden="true"></i><span id="age">connecting</span></div>
      </div>
    </header>
    <div class="board-wrap" id="root">
      <p class="empty">Loading…</p>
    </div>
    <footer class="foot">
      Source of truth is Markdown under <code>.scratch/</code>. Click a ticket to expand.
      Auto-refresh 3s · <code>npm run issues:board</code>
    </footer>
  </div>
  <script>
    const root = document.getElementById("root");
    const tabsEl = document.getElementById("tabs");
    let lastJson = "";
    let activeTrackId = localStorage.getItem("chartstead-issue-board-tab") || "";
    const openIds = new Set();

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function shortId(id) {
      const m = String(id).match(/^(\d+[a-z]?)/i);
      return m ? m[1] : id;
    }

    function shortTitle(title) {
      return String(title).replace(/^\d+[a-z]?\s*[—–-]\s*/i, "").trim();
    }

    function cardHtml(issue, trackId) {
      const key = trackId + ":" + issue.id;
      const progress =
        issue.checkTotal > 0
          ? issue.doneCount + "/" + issue.checkTotal
          : "—";

      let checks = "";
      if (issue.checks && issue.checks.length) {
        const items = issue.checks
          .map(function (c) {
            return (
              '<li class="' +
              (c.done ? "on" : "") +
              '"><i aria-hidden="true"></i><span>' +
              esc(c.text) +
              "</span></li>"
            );
          })
          .join("");
        checks =
          '<div><h3>Checklist</h3><ul class="checks">' + items + "</ul></div>";
      }

      let notes = "";
      if (issue.comments && issue.comments.length) {
        const items = issue.comments
          .map(function (c) {
            return "<li>" + esc(c) + "</li>";
          })
          .join("");
        notes =
          '<div><h3>Recent notes</h3><ul class="notes">' + items + "</ul></div>";
      }

      return (
        '<article class="card" data-col="' +
        esc(issue.column) +
        '" data-issue="' +
        esc(key) +
        '">' +
        '<button type="button" class="summary" aria-expanded="false">' +
        '<div class="id">' +
        esc(shortId(issue.id)) +
        "</div>" +
        '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '<div class="title">' +
        esc(shortTitle(issue.title)) +
        "</div>" +
        '<div class="meta-line">' +
        '<span class="flag ' +
        esc(issue.column) +
        '">' +
        esc(issue.status) +
        "</span>" +
        "<span>" +
        esc(progress) +
        "</span>" +
        "</div>" +
        "</button>" +
        '<div class="detail">' +
        (issue.what ? "<p>" + esc(issue.what) + "</p>" : "<p>No summary.</p>") +
        '<div class="kv">' +
        "<div>Blocked by: " +
        esc(issue.blockedBy || "—") +
        "</div>" +
        "<div>Updated: " +
        esc(new Date(issue.mtime).toLocaleString()) +
        "</div>" +
        "<div><code>" +
        esc(issue.path) +
        "</code></div>" +
        "</div>" +
        checks +
        notes +
        "</div>" +
        "</article>"
      );
    }

    function setActiveTab(trackId) {
      activeTrackId = trackId;
      localStorage.setItem("chartstead-issue-board-tab", trackId);
      tabsEl.querySelectorAll(".tab").forEach(function (tab) {
        const on = tab.getAttribute("data-track") === trackId;
        tab.setAttribute("aria-selected", on ? "true" : "false");
      });
      root.querySelectorAll(".board").forEach(function (board) {
        board.classList.toggle(
          "is-active",
          board.getAttribute("data-track") === trackId,
        );
      });
    }

    function bindCards(scope) {
      scope.querySelectorAll("[data-issue]").forEach(function (el) {
        const key = el.getAttribute("data-issue");
        if (openIds.has(key)) {
          el.classList.add("is-open");
          const btn = el.querySelector(".summary");
          if (btn) btn.setAttribute("aria-expanded", "true");
        }
        el.querySelector(".summary").addEventListener("click", function () {
          const open = el.classList.toggle("is-open");
          el.querySelector(".summary").setAttribute(
            "aria-expanded",
            open ? "true" : "false",
          );
          if (open) openIds.add(key);
          else openIds.delete(key);
        });
      });
    }

    function render(board) {
      document.getElementById("c-total").textContent = board.counts.total;
      document.getElementById("c-done").textContent = board.counts.done;
      document.getElementById("c-open").textContent =
        board.counts.open + board.counts.inProgress;
      document.getElementById("c-other").textContent = board.counts.blocked;
      document.getElementById("age").textContent = new Date(
        board.generatedAt,
      ).toLocaleTimeString();

      if (
        !activeTrackId ||
        !board.tracks.some(function (t) {
          return t.id === activeTrackId;
        })
      ) {
        activeTrackId = board.tracks[0] ? board.tracks[0].id : "";
      }

      tabsEl.innerHTML = board.tracks
        .map(function (track) {
          return (
            '<button type="button" class="tab" role="tab" data-track="' +
            esc(track.id) +
            '" aria-selected="' +
            (track.id === activeTrackId ? "true" : "false") +
            '">' +
            esc(track.title) +
            "<b>" +
            track.issues.length +
            "</b></button>"
          );
        })
        .join("");

      tabsEl.querySelectorAll(".tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          setActiveTab(tab.getAttribute("data-track"));
        });
      });

      root.innerHTML = board.tracks
        .map(function (track) {
          const cols = board.columns
            .map(function (col) {
              const cards = track.issues.filter(function (i) {
                return i.column === col.id;
              });
              const body =
                cards.length === 0
                  ? '<div class="empty">—</div>'
                  : cards
                      .map(function (issue) {
                        return cardHtml(issue, track.id);
                      })
                      .join("");
              return (
                '<section class="col" aria-label="' +
                esc(col.title) +
                '">' +
                '<div class="col-head"><span>' +
                esc(col.title) +
                "</span><b>" +
                cards.length +
                "</b></div>" +
                '<div class="list">' +
                body +
                "</div>" +
                "</section>"
              );
            })
            .join("");
          return (
            '<section class="board' +
            (track.id === activeTrackId ? " is-active" : "") +
            '" data-track="' +
            esc(track.id) +
            '" role="tabpanel">' +
            cols +
            "</section>"
          );
        })
        .join("");

      bindCards(root);
    }

    async function tick() {
      try {
        const res = await fetch("/api/board", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const board = await res.json();
        const json = JSON.stringify(board);
        if (json !== lastJson) {
          lastJson = json;
          render(board);
        } else {
          document.getElementById("age").textContent = new Date(
            board.generatedAt,
          ).toLocaleTimeString();
        }
      } catch (err) {
        document.getElementById("age").textContent = "offline";
        if (!lastJson) {
          root.innerHTML =
            '<div class="error">Could not load <code>/api/board</code>. Is the issue board service running?</div>';
        }
      }
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
