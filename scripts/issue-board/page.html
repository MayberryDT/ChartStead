<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChartStead · Issues</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #081d3a;
      --on-primary: #ffffff;
      --secondary: #2f5d98;
      --tertiary: #22b573;
      --background: #ffffff;
      --surface: #ffffff;
      --surface-subtle: #f3f5f7;
      --surface-muted: #e9edf2;
      --on-surface: #081d3a;
      --on-surface-variant: #526071;
      --on-surface-muted: #5b6878;
      --outline: #d7dee7;
      --outline-strong: #aebac8;
      --selection: #eaf2fb;
      --info-container: #eaf2fb;
      --on-info-container: #244e7d;
      --success-container: #e9f8f1;
      --on-success-container: #087a4d;
      --warning-container: #fff4e5;
      --on-warning-container: #8a4d09;
      --focus-ring: #2f5d98;
      --r: 2px;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --dur: 140ms;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      color: var(--on-surface);
      background: var(--surface-subtle);
      font-feature-settings: "tnum" 1;
      -webkit-font-smoothing: antialiased;
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
      text-align: left;
    }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      height: 48px;
      background: var(--primary);
      color: var(--on-primary);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
    }
    .brand strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-meta {
      display: flex;
      align-items: stretch;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
    }
    .stat {
      display: grid;
      justify-items: center;
      min-width: 52px;
      padding: 4px 10px;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
    }
    .stat:last-child { border-right: 0; }
    .stat b {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .stat em {
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }
    .live {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }
    .live i {
      width: 6px;
      height: 6px;
      background: var(--tertiary);
      display: inline-block;
    }

    .shell {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-content: start;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
    }

    .track {
      background: var(--surface);
      border: 1px solid var(--outline);
      box-shadow: 0 1px 2px rgba(8, 29, 58, 0.04);
      min-width: 0;
    }
    .track-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--outline);
    }
    .track-head h2 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
    }
    .track-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--on-surface-muted);
      font-variant-numeric: tabular-nums;
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .col {
      min-width: 0;
      border-right: 1px solid var(--outline);
    }
    .col:last-child { border-right: 0; }
    .col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--outline);
      background: var(--surface-subtle);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--on-surface-muted);
    }
    .col-head b {
      font-weight: 600;
      color: var(--on-surface);
      font-variant-numeric: tabular-nums;
    }
    .list { display: flex; flex-direction: column; }
    .empty {
      padding: 10px 8px;
      color: var(--on-surface-muted);
      font-size: 12px;
    }

    .card {
      border-bottom: 1px solid var(--outline);
      background: var(--surface);
    }
    .card:last-child { border-bottom: 0; }
    .card[data-col="done"] { box-shadow: inset 3px 0 0 var(--tertiary); }
    .card[data-col="open"] { box-shadow: inset 3px 0 0 var(--secondary); }
    .card[data-col="in-progress"] { box-shadow: inset 3px 0 0 #5c3f8c; }
    .card[data-col="blocked"] { box-shadow: inset 3px 0 0 #c47a16; }

    .summary {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 14px;
      gap: 2px 8px;
      padding: 7px 8px 7px 10px;
      align-items: start;
    }
    .summary:hover { background: var(--selection); }
    .card.is-open > .summary {
      background: var(--selection);
      border-bottom: 1px solid var(--outline);
    }
    .id {
      grid-column: 1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--on-surface-muted);
      line-height: 1.2;
    }
    .chev {
      grid-column: 2;
      grid-row: 1 / span 2;
      align-self: center;
      width: 14px;
      height: 14px;
      color: var(--on-surface-muted);
      transition: transform var(--dur) var(--ease);
    }
    .card.is-open .chev { transform: rotate(90deg); }
    .title {
      grid-column: 1;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.01em;
      color: var(--on-surface);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta-line {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      align-items: center;
      margin-top: 2px;
      font-size: 11px;
      color: var(--on-surface-muted);
    }
    .flag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 5px;
      border: 1px solid var(--outline);
      background: var(--surface-subtle);
      color: var(--on-surface-variant);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.3;
      text-transform: lowercase;
      border-radius: var(--r);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .flag::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--outline-strong);
    }
    .flag.done {
      background: var(--success-container);
      color: var(--on-success-container);
      border-color: #b7e5cf;
    }
    .flag.done::before { background: var(--tertiary); }
    .flag.open {
      background: var(--info-container);
      color: var(--on-info-container);
      border-color: #b7cce8;
    }
    .flag.open::before { background: var(--secondary); }
    .flag.in-progress {
      background: #f0ebfa;
      color: #5c3f8c;
      border-color: #d5c8ef;
    }
    .flag.in-progress::before { background: #5c3f8c; }
    .flag.blocked {
      background: var(--warning-container);
      color: var(--on-warning-container);
      border-color: #f0d4a8;
    }
    .flag.blocked::before { background: #c47a16; }

    .detail {
      display: none;
      padding: 8px 10px 10px;
      background: var(--surface-subtle);
      gap: 8px;
    }
    .card.is-open .detail { display: grid; }
    .detail p {
      margin: 0;
      font-size: 12px;
      color: var(--on-surface-variant);
      line-height: 1.45;
    }
    .detail h3 {
      margin: 0 0 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--on-surface-muted);
    }
    .checks, .notes {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 3px;
    }
    .checks li {
      display: grid;
      grid-template-columns: 12px 1fr;
      gap: 6px;
      font-size: 11.5px;
      color: var(--on-surface-variant);
      line-height: 1.35;
    }
    .checks li i {
      width: 10px;
      height: 10px;
      margin-top: 2px;
      border: 1px solid var(--outline-strong);
      background: var(--surface);
      border-radius: var(--r);
    }
    .checks li.on i {
      background: var(--tertiary);
      border-color: var(--tertiary);
    }
    .checks li.on {
      color: var(--on-surface-muted);
      text-decoration: line-through;
      text-decoration-color: var(--outline-strong);
    }
    .kv {
      display: grid;
      gap: 4px;
      font-size: 11px;
      color: var(--on-surface-muted);
    }
    .kv code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      color: var(--on-surface-variant);
      word-break: break-all;
    }
    .notes li {
      font-size: 11.5px;
      color: var(--on-surface-variant);
      padding: 6px 7px;
      border: 1px solid var(--outline);
      background: var(--surface);
      border-radius: var(--r);
    }

    .foot {
      grid-column: 1 / -1;
      font-size: 11px;
      color: var(--on-surface-muted);
      padding: 0 2px;
    }
    .foot code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 10.5px;
    }
    .error {
      grid-column: 1 / -1;
      padding: 16px;
      border: 1px solid #e8b4af;
      background: #fdecea;
      color: #8a1c13;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>ChartStead</strong>
        <span>Issue board · .scratch Markdown</span>
      </div>
      <div class="top-meta" aria-label="Summary counts">
        <div class="stat"><b id="c-total">0</b><em>total</em></div>
        <div class="stat"><b id="c-done">0</b><em>done</em></div>
        <div class="stat"><b id="c-open">0</b><em>open</em></div>
        <div class="stat"><b id="c-other">0</b><em>other</em></div>
        <div class="live"><i aria-hidden="true"></i><span id="age">connecting</span></div>
      </div>
    </header>
    <main class="shell" id="root">
      <p class="empty">Loading…</p>
    </main>
  </div>
  <script>
    const root = document.getElementById("root");
    let lastJson = "";
    const openIds = new Set();

    function esc(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function shortId(id) {
      const m = String(id).match(/^(\d+[a-z]?)/i);
      return m ? m[1] : id;
    }

    function shortTitle(title) {
      return String(title).replace(/^\d+[a-z]?\s*[—–-]\s*/i, "").trim();
    }

    function cardHtml(issue, trackId) {
      const key = trackId + ":" + issue.id;
      const progress =
        issue.checkTotal > 0
          ? issue.doneCount + "/" + issue.checkTotal
          : "—";

      let checks = "";
      if (issue.checks && issue.checks.length) {
        const items = issue.checks
          .map(function (c) {
            return (
              '<li class="' +
              (c.done ? "on" : "") +
              '"><i aria-hidden="true"></i><span>' +
              esc(c.text) +
              "</span></li>"
            );
          })
          .join("");
        checks =
          "<div><h3>Checklist</h3><ul class=\"checks\">" + items + "</ul></div>";
      }

      let notes = "";
      if (issue.comments && issue.comments.length) {
        const items = issue.comments
          .map(function (c) {
            return "<li>" + esc(c) + "</li>";
          })
          .join("");
        notes =
          "<div><h3>Recent notes</h3><ul class=\"notes\">" + items + "</ul></div>";
      }

      return (
        '<article class="card" data-col="' +
        esc(issue.column) +
        '" data-issue="' +
        esc(key) +
        '">' +
        '<button type="button" class="summary" aria-expanded="false">' +
        '<div class="id">' +
        esc(shortId(issue.id)) +
        "</div>" +
        '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>' +
        '<div class="title">' +
        esc(shortTitle(issue.title)) +
        "</div>" +
        '<div class="meta-line">' +
        '<span class="flag ' +
        esc(issue.column) +
        '">' +
        esc(issue.status) +
        "</span>" +
        "<span>" +
        esc(progress) +
        "</span>" +
        "</div>" +
        "</button>" +
        '<div class="detail">' +
        (issue.what ? "<p>" + esc(issue.what) + "</p>" : "<p>No summary.</p>") +
        '<div class="kv">' +
        "<div>Blocked by: " +
        esc(issue.blockedBy || "—") +
        "</div>" +
        "<div>Updated: " +
        esc(new Date(issue.mtime).toLocaleString()) +
        "</div>" +
        "<div><code>" +
        esc(issue.path) +
        "</code></div>" +
        "</div>" +
        checks +
        notes +
        "</div>" +
        "</article>"
      );
    }

    function render(board) {
      document.getElementById("c-total").textContent = board.counts.total;
      document.getElementById("c-done").textContent = board.counts.done;
      document.getElementById("c-open").textContent =
        board.counts.open + board.counts.inProgress;
      document.getElementById("c-other").textContent = board.counts.blocked;
      document.getElementById("age").textContent = new Date(
        board.generatedAt,
      ).toLocaleTimeString();

      root.innerHTML =
        board.tracks
          .map(function (track) {
            const cols = board.columns
              .map(function (col) {
                const cards = track.issues.filter(function (i) {
                  return i.column === col.id;
                });
                const body =
                  cards.length === 0
                    ? '<div class="empty">—</div>'
                    : cards
                        .map(function (issue) {
                          return cardHtml(issue, track.id);
                        })
                        .join("");
                return (
                  '<section class="col" aria-label="' +
                  esc(col.title) +
                  '">' +
                  '<div class="col-head"><span>' +
                  esc(col.title) +
                  "</span><b>" +
                  cards.length +
                  "</b></div>" +
                  '<div class="list">' +
                  body +
                  "</div>" +
                  "</section>"
                );
              })
              .join("");
            return (
              '<section class="track">' +
              '<div class="track-head">' +
              "<h2>" +
              esc(track.title) +
              "</h2>" +
              '<div class="track-count">' +
              track.issues.length +
              "</div>" +
              "</div>" +
              '<div class="cols">' +
              cols +
              "</div>" +
              "</section>"
            );
          })
          .join("") +
        '<p class="foot">Source of truth is Markdown under <code>.scratch/</code>. Click a ticket to expand. Auto-refresh 3s · <code>npm run issues:board</code></p>';

      root.querySelectorAll("[data-issue]").forEach(function (el) {
        const key = el.getAttribute("data-issue");
        if (openIds.has(key)) {
          el.classList.add("is-open");
          const btn = el.querySelector(".summary");
          if (btn) btn.setAttribute("aria-expanded", "true");
        }
        el.querySelector(".summary").addEventListener("click", function () {
          const open = el.classList.toggle("is-open");
          el.querySelector(".summary").setAttribute(
            "aria-expanded",
            open ? "true" : "false",
          );
          if (open) openIds.add(key);
          else openIds.delete(key);
        });
      });
    }

    async function tick() {
      try {
        const res = await fetch("/api/board", { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const board = await res.json();
        const json = JSON.stringify(board);
        if (json !== lastJson) {
          lastJson = json;
          render(board);
        } else {
          document.getElementById("age").textContent = new Date(
            board.generatedAt,
          ).toLocaleTimeString();
        }
      } catch (err) {
        document.getElementById("age").textContent = "offline";
        if (!lastJson) {
          root.innerHTML =
            '<div class="error">Could not load <code>/api/board</code>. Is <code>npm run issues:board</code> running?</div>';
        }
      }
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
